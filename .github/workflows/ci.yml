name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Las pruebas van antes del build: un paso que falla salta los siguientes, y
      # un build roto no debe esconder qué pruebas fallan (en el backend, flake8
      # dejó a pytest en «skipped» cuatro meses).
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
