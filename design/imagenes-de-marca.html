<!doctype html>
<!--
  Fuente de las dos imágenes de marca que sirve public/. Los PNG se versionan,
  pero no se retocan a mano: se regeneran desde aquí.

    · public/og-cover.png         1200×630  og:image / twitter:image de index.html
    · public/apple-touch-icon.png  180×180  este archivo con #icono

  El átomo es copia literal de src/landing/AtomLogo.tsx; el titular y la etiqueta
  son los del hero (src/landing/HeroSection.tsx). Si cambia alguno, se cambia aquí
  y se regenera desde nucleo-web-admin/ (necesita red: las fuentes vienen de Google):

    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CHROME" --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --virtual-time-budget=8000 --window-size=1200,630 \
      --screenshot="$PWD/public/og-cover.png" "file://$PWD/design/imagenes-de-marca.html"
    "$CHROME" --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --virtual-time-budget=8000 --window-size=180,180 \
      --screenshot="$PWD/public/apple-touch-icon.png" "file://$PWD/design/imagenes-de-marca.html#icono"

  Antes de dar por buena una captura, confirma que cargaron las fuentes (si falla la
  red, Chrome pinta con la de sistema y no avisa):

    "$CHROME" --headless=new --virtual-time-budget=8000 --dump-dom \
      "file://$PWD/design/imagenes-de-marca.html" | grep -o 'data-fuentes="[^"]*"'

  Debe listar Space Grotesk 500/600 y JetBrains Mono 400/500.
-->
<html lang="es-GT">
  <head>
    <meta charset="utf-8" />
    <title>Imágenes de marca · Nucleo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      :root {
        --ink: #0a0a0b;
        --flame: #fc4c02;
      }
      html,
      body {
        margin: 0;
        background: var(--ink);
      }
      body {
        -webkit-font-smoothing: antialiased;
      }

      /* ── Portada 1200×630 (lenguaje de la landing: negro, blanco domina, naranja
            solo como acento sólido, cero glow) ─────────────────────────────── */
      .portada {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #fff;
      }
      .marca {
        position: absolute;
        left: 72px;
        top: 58px;
        display: flex;
        align-items: center;
        gap: 14px;
        font: 600 40px/1 "Space Grotesk", sans-serif;
        letter-spacing: -0.025em;
      }
      .mono {
        margin: 0;
        font: 500 15px/1 "JetBrains Mono", monospace;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      .etiqueta {
        position: absolute;
        right: 72px;
        top: 74px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: rgba(255, 255, 255, 0.6);
      }
      .punto {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--flame);
      }
      .titular {
        position: absolute;
        left: 68px;
        top: 214px;
        margin: 0;
        font: 500 108px/0.95 "Space Grotesk", sans-serif;
        letter-spacing: -0.04em; /* .hero-title */
      }
      .flame {
        color: var(--flame);
      }
      .pie {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 58px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 26px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        font-weight: 400;
        color: rgba(255, 255, 255, 0.45);
      }
      .sitio {
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: none;
      }

      /* ── Ícono 180×180: iOS redondea las esquinas, así que va a sangre ──── */
      .icono {
        display: none;
        width: 180px;
        height: 180px;
        place-items: center;
      }
      .solo-icono .portada {
        display: none;
      }
      .solo-icono .icono {
        display: grid;
      }
    </style>
  </head>
  <body>
    <!-- Átomo de src/landing/AtomLogo.tsx (mismos gradientes, órbitas y electrones). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <radialGradient id="atom-core" cx="50%" cy="42%" r="60%">
          <stop offset="0%" stop-color="#fff4ec" />
          <stop offset="35%" stop-color="#FFB07A" />
          <stop offset="70%" stop-color="#FC4C02" />
          <stop offset="100%" stop-color="#9e2e00" />
        </radialGradient>
        <linearGradient id="orbit-a" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FF9F1C" />
          <stop offset="100%" stop-color="#FC4C02" />
        </linearGradient>
        <symbol id="atomo" viewBox="0 0 100 100" overflow="visible">
          <g fill="none" stroke="url(#orbit-a)">
            <ellipse cx="50" cy="50" rx="42" ry="16" stroke-width="2" opacity="0.85" />
            <ellipse cx="50" cy="50" rx="42" ry="16" stroke-width="2" opacity="0.7" transform="rotate(60 50 50)" />
            <ellipse cx="50" cy="50" rx="42" ry="16" stroke-width="2" opacity="0.7" transform="rotate(120 50 50)" />
          </g>
          <circle cx="92" cy="50" r="3.6" fill="#FFB07A" />
          <circle cx="29" cy="13.6" r="3.2" fill="#FF9F1C" />
          <circle cx="29" cy="86.4" r="3.2" fill="#FF7A3D" />
          <circle cx="50" cy="50" r="9" fill="url(#atom-core)" />
          <circle cx="50" cy="50" r="9" fill="none" stroke="#fff4ec" stroke-width="0.7" opacity="0.85" />
        </symbol>
      </defs>
    </svg>

    <main class="portada">
      <span class="marca"><svg width="52" height="52"><use href="#atomo" /></svg>nucleo</span>
      <p class="mono etiqueta"><span class="punto"></span>Red deportiva · Guatemala</p>
      <h1 class="titular">Opera tu gym.<br />Retén a tu gente<span class="flame">.</span></h1>
      <footer class="mono pie">
        <span>Membresías · cobros · clases · comunidad</span>
        <span class="sitio">app.nucleo.fit</span>
      </footer>
    </main>

    <div class="icono">
      <svg width="128" height="128"><use href="#atomo" /></svg>
    </div>

    <script>
      if (location.hash === "#icono") document.body.classList.add("solo-icono");
      document.fonts.ready.then(() => {
        const cargadas = [...document.fonts]
          .filter((f) => f.status === "loaded")
          .map((f) => `${f.family.replace(/"/g, "")} ${f.weight}`);
        document.documentElement.dataset.fuentes = [...new Set(cargadas)].join(", ") || "ninguna";
      });
    </script>
  </body>
</html>
